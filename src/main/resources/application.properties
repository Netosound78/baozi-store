spring.application.name=baozi-store
server.port=8080

# ===== Banco de dados H2 (padrao) =====
# Arquivo salvo em ./data/baozidb (os dados permanecem apos reiniciar)
spring.datasource.url=jdbc:h2:file:./data/baozidb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/baozidb)
spring.h2.console.enabled=true

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
